# constat:template id=elixir-ci-workflow version=52 sha256=20e8bd8ac3cd52c6a589d79f758337ba182a685f65be05a44f87501acefae881
name: constat-ci
# Generated by DoneMark's onboarding pull request. Runs "mix test" with
# Constat.CheckReportFormatter enabled and publishes the per-test report it writes, plus a second
# job that reruns the same suite against the code as it was before the change.
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.17'
          otp-version: '27.1.2'
      - run: mix deps.get
      - id: tests
        run: mix test
      - if: always() && steps.tests.conclusion != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: constat-check-report
          path: .constat/check-report/checks.json
          if-no-files-found: error

  base-comparison:
    needs: test
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - id: head-report
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: constat-check-report
          path: .constat/head-report
      - if: steps.head-report.outcome != 'success'
        run: |
          echo "::warning::the test job published no constat-check-report, so there is nothing to" \
               "compare against; publishing no before-code report. DoneMark will read every" \
               "criterion as passed-but-unproven, which is the honest degradation."
      - uses: erlef/setup-beam@v1
        if: steps.head-report.outcome == 'success'
        with:
          elixir-version: '1.17'
          otp-version: '27.1.2'
      - if: steps.head-report.outcome == 'success'
        run: bash .github/scripts/constat-rewind-to-base.sh "${{ github.base_ref }}"
      - if: steps.head-report.outcome == 'success'
        run: mix deps.get
      - id: base-tests
        if: steps.head-report.outcome == 'success'
        continue-on-error: true
        env:
          CONSTAT_CHECK_REPORT_PATH: .constat/check-report-base/checks.json
          CONSTAT_EXPECTED_REPORT: .constat/head-report/checks.json
        run: mix test
      - if: always() && steps.base-tests.conclusion != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: constat-check-report-base
          path: .constat/check-report-base/checks.json
          if-no-files-found: error

  # BEYOND THE LINES (board 46): packages with a known flaw, and secret-shaped strings, as SARIF for
  # DoneMark to read as the security square. Never able to fail this workflow: a scanner that cannot
  # run leaves its report out, and DoneMark says "not measured". gitleaks runs with --redact, so a
  # secret it finds is never written into the report at all.
  security:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Scan packages and secrets
        continue-on-error: true
        run: |
          mkdir -p .constat/security
          curl -sSfL -o "$RUNNER_TEMP/osv-scanner" https://github.com/google/osv-scanner/releases/download/v1.9.2/osv-scanner_linux_amd64 \
            && chmod +x "$RUNNER_TEMP/osv-scanner" \
            && ("$RUNNER_TEMP/osv-scanner" --format sarif --output .constat/security/packages.sarif -r . || true)
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz -C "$RUNNER_TEMP" gitleaks \
            && "$RUNNER_TEMP/gitleaks" detect --source . --no-git --redact --no-banner --exit-code 0 --report-format sarif --report-path .constat/security/secrets.sarif
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('.constat/security/*.sarif') != ''
        with:
          # DoneMark's collector looks this artifact up by name and reads every .sarif file in it.
          name: constat-security
          path: .constat/security/
